<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181716" />
      <stop offset="100%" stop-color="#0D0C0B" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5AA52" />
      <stop offset="50%" stop-color="#C58B39" />
      <stop offset="100%" stop-color="#9E6B24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C58B39" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" />
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="160" fill="#141312" stroke="#2B2926" stroke-width="2" />
  
  <!-- Lens Aperture & Luxury Frame -->
  <polygon points="256,120 360,195 360,317 256,392 152,317 152,195" fill="none" stroke="url(#gold-grad)" stroke-width="3" stroke-dasharray="8 6" />

  <!-- The Main Character "M" Monogram with Serif Stylings -->
  <text x="256" y="310" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="190" font-weight="bold" fill="url(#gold-grad)" text-anchor="middle" filter="url(#glow)">M</text>
  
  <!-- Brand Caption -->
  <text x="256" y="375" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#E8E3D9" text-anchor="middle">CREW PWA</text>
  <text x="256" y="405" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#C58B39" text-anchor="middle">THE MAIN CHARACTER</text>
</svg>
